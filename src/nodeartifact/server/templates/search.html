{% macro clear_icon() %}<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg>{% endmacro %}
{% macro search_form(text, clear_url) -%}
<form class="nodestep-search" role="search" action="{{ url_for('trace_list') }}" method="get">
<label class="nodestep-search-icon" for="trace-search"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5-1.5 1.5-5-5v-.79l-.27-.27A6.52 6.52 0 0 1 9.5 16 6.5 6.5 0 0 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14 14 12 14 9.5 12 5 9.5 5"></path></svg></label>
<input class="nodestep-search-input" id="trace-search" type="search" name="q" value="{{ text }}" maxlength="{{ search_max_length }}" autocomplete="off" placeholder="Search traces" aria-label="Search traces">
{% if clear_url %}<a class="nodestep-search-clear" href="{{ clear_url }}" aria-label="Clear the search" data-clear-search>{{ clear_icon() }}</a>{% else %}<button class="nodestep-search-clear" type="reset" aria-label="Clear the search">{{ clear_icon() }}</button>{% endif %}
</form>
{%- endmacro %}
