[project]
name = "nodeartifact"
version = "0.1.0a1"
description = "OpenTelemetry tracing for nodestep graphs, with a local OTLP/HTTP server and web UI (alpha)"
authors = [
  {name = 'Marek Filo', email = 'mrf.software@pm.me'}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["opentelemetry", "otlp", "tracing", "observability", "llm", "agents", "nodestep"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "nodestep @ git+https://github.com/nodestep-ai/nodestep",
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-sdk>=1.44.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
]

[project.optional-dependencies]
server = [
    "starlette>=1.6.0,<2",
    "jinja2>=3.1.6,<4",
    "uvicorn>=0.53.0,<1",
    "opentelemetry-proto>=1.44.0,<2",
    "typer>=0.27.2,<1",
]

[project.scripts]
nodeartifact = "nodeartifact.cli:main"

[project.urls]
Homepage = "https://github.com/nodestep-ai/nodeartifact"
Source = "https://github.com/nodestep-ai/nodeartifact"
Changelog = "https://github.com/nodestep-ai/nodeartifact/blob/main/CHANGELOG.md"
Issues = "https://github.com/nodestep-ai/nodeartifact/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.9",
    "ty==0.0.84",
    "httpx==0.28.1",
]


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodeartifact"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "assets", "docs", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
